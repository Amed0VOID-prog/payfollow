<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>PayFollow – Clients</title>
<style>
:root{--g:#1f7a3d;--gd:#176330;--gp:#e8f3ec;--navy:#10193a;--mut:#5d6a64;--line:#e1e7e4;--bg:#f3f6f4;--red:#c62828;--amb:#b45309;--ok:#176330}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--navy);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:92px}
button,input,a{font:inherit;color:inherit}
button{cursor:pointer}
a{text-decoration:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid rgba(31,122,61,.45);outline-offset:2px}

.nav{position:sticky;top:0;z-index:30;padding:10px 16px;background:var(--bg)}
.pill{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand b{color:var(--g)}
.lg{width:34px;height:34px;color:var(--g);--cl:#fff}
.tabs,.new{display:none}
.me{position:relative}
.avt{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--g);font-weight:800;font-size:17px}
.menu{position:absolute;right:0;top:52px;z-index:40;width:236px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 16px 38px rgba(16,25,58,.16);animation:pop .18s ease both}
.menu[hidden]{display:none}
.menu h3{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:600}
.menu button{display:flex;width:100%;justify-content:space-between;border:0;background:none;padding:10px;border-radius:10px;font-size:15px;text-align:left}
.menu button[aria-checked="true"]{background:var(--gp);color:var(--gd);font-weight:700}
.menu button[aria-checked="true"]::after{content:"✓"}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}

main{max-width:1180px;margin:0 auto;padding:0 16px;animation:vin .42s cubic-bezier(.2,.7,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateX(22px)}}
.rv{animation:rv .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rv{from{opacity:0;transform:translateY(14px)}}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:14px 0 16px}
.top h1{margin:0;font-size:29px;letter-spacing:-.025em}
.top p{margin:2px 0 0;color:var(--mut)}
.add{border:0;background:var(--g);color:#fff;font-weight:700;padding:11px 18px;border-radius:99px;white-space:nowrap;transition:background .2s,transform .2s}
.add:hover{background:var(--gd);transform:translateY(-1px)}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 1px 2px rgba(16,25,58,.05),0 10px 26px rgba(16,25,58,.05)}
.sub{color:var(--mut);font-size:13px}

.stats{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.sc{border:1.5px solid var(--line);border-radius:20px;padding:15px 18px 16px;background:#fff}
.sc.red{background:#fde8e8;border-color:#d83a34}
.sc.grn{background:#e8f4ec;border-color:#1f9a57}
.sc .t{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.sc .t i{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;color:#2563eb}
.sc.red .t i{color:#d83a34}
.sc.grn .t i{color:#1f9a57}
.sc .t svg{width:18px;height:18px}
.sc .s{color:var(--mut);font-size:14px;margin-top:4px}
.sc .v{display:block;font-size:28px;font-weight:800;letter-spacing:-.025em;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap}



.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 12px}
.search{position:relative;flex:1;min-width:210px}
.search .ic{position:absolute;left:14px;top:13px;color:var(--mut);width:20px;height:20px}
.search input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:99px;padding:0 16px 0 44px;font-size:16px;background:#fff;color:var(--navy);-webkit-appearance:none;appearance:none;color-scheme:light}
.search input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px rgba(31,122,61,.15)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:none}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap;transition:all .2s}
.chips button[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
.chips em{font-style:normal;opacity:.75;margin-left:5px}

.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hd{display:none}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 18px;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 1px 2px rgba(16,25,58,.05);cursor:pointer;transition:transform .18s,box-shadow .18s}
.row:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(16,25,58,.09)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av2{width:42px;height:42px;border-radius:50%;background:var(--bgc);color:var(--c);display:grid;place-items:center;font-weight:800;flex:none}
.c-f,.c-p,.em,.st{display:none}
.a{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.late{color:var(--red)} .wait{color:var(--amb)} .paid{color:var(--ok)}
.pill2{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill2.late{background:#fdecea} .pill2.wait{background:#fef3e2} .pill2.paid{background:var(--gp)}
.chev{color:#a7b3ad;width:18px;height:18px}
.stm{font-size:13px;font-weight:600}
.none{text-align:center;padding:40px 10px;color:var(--mut)}

.ov{position:fixed;inset:0;background:rgba(16,25,58,.4);opacity:0;transition:opacity .28s;z-index:50}
.ov.open{opacity:1}
.dr{position:fixed;z-index:60;background:#fff;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);box-shadow:0 -14px 40px rgba(16,25,58,.18)}
.dr.open{transform:none}
.dr[hidden],.ov[hidden]{display:none}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.dh{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.dh .av2{width:56px;height:56px;font-size:22px}
.dh h2{margin:0;font-size:22px;letter-spacing:-.02em}
.x{margin-left:auto;border:0;background:var(--bg);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.ct{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.ct a{display:grid;justify-items:center;gap:4px;padding:11px 6px;border-radius:14px;background:var(--gp);color:var(--gd);font-size:13px;font-weight:700;transition:background .2s}
.ct a:hover{background:#d6ebdd}
.ds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.ds div{background:var(--bg);border-radius:14px;padding:11px 10px}
.ds span{display:block;font-size:12px;color:var(--mut)}
.ds b{display:block;font-size:15px;font-variant-numeric:tabular-nums;margin-top:2px}
.dr h3{margin:0 0 8px;font-size:15px}
.hist{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:6px}
.hist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14px}
.hist .n{flex:1}
.go{width:100%;height:52px;border:0;border-radius:99px;background:var(--g);color:#fff;font-weight:700;font-size:16px;box-shadow:0 10px 22px rgba(31,122,61,.25)}
.go:hover{background:var(--gd)}
.fm .f{position:relative;margin-bottom:12px}
.fm .f svg{position:absolute;left:17px;top:16px;width:20px;height:20px;color:var(--g)}
.fm input{width:100%;height:52px;border:1.5px solid var(--line);border-radius:999px;padding:0 16px 0 48px;font-size:16px;background:#fff!important;color:var(--navy)!important;-webkit-text-fill-color:var(--navy);-webkit-appearance:none;appearance:none;color-scheme:light;box-shadow:0 6px 18px rgba(31,122,61,.08)}
.fm input::placeholder{color:#8a9791;-webkit-text-fill-color:#8a9791}
.fm input:-webkit-autofill{-webkit-box-shadow:0 0 0 60px #fff inset;-webkit-text-fill-color:var(--navy)}
.fm input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px rgba(31,122,61,.15)}
.fm input[aria-invalid="true"]{border-color:var(--red)}
.err{color:var(--red);font-size:14px;font-weight:500;min-height:20px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:80;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

.tb{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.tb>*{position:relative;border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mut);padding:6px 4px}
.tb [aria-current="page"]{color:var(--g)}
.tb [aria-current="page"]::before{content:"";position:absolute;top:-9px;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--g)}

@media (min-width:900px){
  body{padding-bottom:48px}
  .nav{background:transparent;padding:16px 24px 0;pointer-events:none}
  .pill{pointer-events:auto;background:#fff;border-radius:99px;padding:8px 10px 8px 20px;box-shadow:0 1px 2px rgba(16,25,58,.06),0 12px 32px rgba(16,25,58,.09)}
  .tabs{display:flex;position:relative;gap:2px;flex:1;justify-content:center}
  .tabs>*{position:relative;z-index:1;border:0;background:none;padding:10px 16px;border-radius:99px;font-weight:600;color:var(--mut)}
  .tabs [aria-current="page"]{color:var(--gd)}
  .ind{position:absolute;top:0;bottom:0;left:0;border-radius:99px;background:var(--gp);transition:transform .4s cubic-bezier(.3,.8,.25,1),width .4s cubic-bezier(.3,.8,.25,1)}
  .new{display:inline-block;border:0;background:var(--g);color:#fff;font-weight:700;padding:11px 20px;border-radius:99px}
  .new:hover{background:var(--gd)}
  main{padding:0 24px}
  .top{margin:30px 0 20px}
  .top h1{font-size:34px}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  
  .card{padding:22px}
  .tools{flex-wrap:nowrap;justify-content:space-between}
  .chips{overflow:visible;margin-left:auto}
  .search{max-width:380px}
  .tb{display:none}
  .hd,.row{grid-template-columns:minmax(0,2.4fr) 1fr 1fr 1.1fr 130px 18px}
  .hd{display:grid;gap:10px;padding:0 14px 4px;color:var(--mut);font-size:13px;font-weight:600}
  .hd span:nth-child(2),.hd span:nth-child(3),.hd span:nth-child(4){text-align:right}
  .c-f,.c-p,.em,.st{display:block}
  .c-f,.c-p{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
  .stm{display:none}
  .dr{left:auto;top:0;width:440px;max-height:none;border-radius:26px 0 0 26px;padding:28px;transform:translateX(100%)}
  .dr.open{transform:none}
  .grab{display:none}
  .toast{bottom:32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Menu : stable d'une page à l'autre */
*{-webkit-tap-highlight-color:transparent}
.tabs>*,.new{white-space:nowrap}
.ind{transition:none}
.ind.ready{transition:transform .4s cubic-bezier(.3,.8,.25,1),width .4s cubic-bezier(.3,.8,.25,1),opacity .2s}
@media (min-width:900px) and (max-width:1120px){.tabs>*{padding:10px 11px;font-size:14px}.new{padding:10px 14px;font-size:14px}.pill{gap:8px}.tabs{margin:0 4px}}
@view-transition{navigation:auto}
.nav{view-transition-name:nav}
.tb{view-transition-name:tb}
::view-transition-old(nav),::view-transition-old(tb){display:none}
::view-transition-new(nav),::view-transition-new(tb){animation:none}

/* Onglets : même hauteur, texte centré, identiques que ce soit un lien ou un bouton */
.tabs{align-items:center;height:42px}
.tabs>*{display:flex;align-items:center;justify-content:center;height:42px;padding-top:0;padding-bottom:0;line-height:1;text-decoration:none;box-sizing:border-box;margin:0}
.tb>*{align-content:center;align-items:center;justify-content:center;line-height:1.2;text-decoration:none}
</style>
</head>

</svg>

<header class="nav">

          <button role="menuitemradio" data-cur="EUR" aria-checked="true">Euro (€)</button>

<main>
  <div class="top rv"><div><h1>Clients</h1><p>Toutes les personnes qui vous doivent de l’argent, au même endroit.</p></div><button class="add" id="addBtn">+ Nouveau client</button></div>
  <section class="stats" id="stats"></section>
  <div class="tools rv" style="--i:4">
    <label class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Rechercher un client" aria-label="Rechercher un client"></label>
    <div class="chips" id="chips"></div>
  </div>
  <div class="hd"><span>Client</span><span>Facturé</span><span>Payé</span><span>Reste à payer</span><span>Statut</span><span></span></div>
  <ul class="list" id="list"></ul>
</main>

<nav class="tb" aria-label="Navigation">

  <button aria-current="page"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-5.5 6.5-5.5s6.5 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .6 3.5 2.2 3.5 5.2"/></svg>Clients</button>
  <a href="payfollow-paiements.html"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/></svg>Paiements</a>
  <a href="payfollow-relances.html"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Relances</a>
  <a href="payfollow-exports.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Plus</a>
</nav>

<div class="ov" id="ov" hidden></div>
<aside class="dr" id="dr" role="dialog" aria-modal="true" aria-label="Fiche client" hidden></aside>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var CUR = { EUR:{s:"€",d:2}, XOF:{s:"FCFA",d:0}, USD:{s:"$",d:2} };
  var cur = "EUR", filter = "all", query = "";
  var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  try { var sv = localStorage.getItem("pf_devise"); if (sv && CUR[sv]) cur = sv; } catch(e){}

  /* Données fictives : n=nom, e=e-mail, t=téléphone, p=déjà payé, late=en retard, up=à venir, d=jours de retard, s=client depuis, h=historique */
  var CL = [
    {n:"Agence Nafa",e:"contact@nafa.exemple",t:"+226 70 00 00 01",p:3300,late:900,up:2600,d:34,s:"mars 2026",h:[["28 oct.",2400,"paid"],["14 oct.",900,"late"],["2 oct.",1300,"paid"]]},
    {n:"Studio Kora",e:"hello@kora.exemple",t:"+226 70 00 00 02",p:2600,late:1200,up:1800,d:12,s:"mai 2026",h:[["25 oct.",800,"paid"],["19 oct.",1200,"late"],["30 sept.",1800,"paid"]]},
    {n:"Boutique Lumière",e:"boutique@lumiere.exemple",t:"+226 70 00 00 03",p:1800,late:650,up:0,d:8,s:"juin 2026",h:[["18 oct.",650,"late"],["5 oct.",1800,"paid"]]},
    {n:"Atelier Sahel",e:"atelier@sahel.exemple",t:"+226 70 00 00 04",p:1200,late:450,up:0,d:75,s:"janv. 2026",h:[["12 oct.",450,"late"],["8 août",1200,"paid"]]},
    {n:"Café Zaka",e:"zaka@cafe.exemple",t:"+226 70 00 00 05",p:900,late:0,up:1500,d:0,s:"août 2026",h:[["22 oct.",1500,"wait"],["10 sept.",900,"paid"]]},
    {n:"Maison Bissa",e:"info@bissa.exemple",t:"+226 70 00 00 06",p:4200,late:0,up:2000,d:0,s:"nov. 2025",h:[["29 oct.",2000,"wait"],["17 oct.",2200,"paid"],["1 sept.",2000,"paid"]]},
    {n:"Kandé Conseil",e:"kande@conseil.exemple",t:"+226 70 00 00 07",p:2700,late:0,up:1350,d:0,s:"avr. 2026",h:[["27 oct.",1350,"wait"],["3 oct.",2700,"paid"]]},
    {n:"Studio Okapi",e:"studio@okapi.exemple",t:"+226 70 00 00 08",p:3500,late:0,up:0,d:0,s:"févr. 2026",h:[["20 oct.",1500,"paid"],["20 sept.",2000,"paid"]]}
  ];
  var TINT = [["#1f7a3d","#e8f3ec"],["#1d4ed8","#e6eefc"],["#b45309","#fef3e2"],["#7c3aed","#efe9fd"],["#be185d","#fce8f1"]];
  var ST = {late:"En retard",wait:"En attente",paid:"À jour"};
  var $ = function(id){ return document.getElementById(id); };

  function fmt(n){ var c = CUR[cur]; return n.toLocaleString("fr-FR",{minimumFractionDigits:c.d,maximumFractionDigits:c.d}) + "\u00a0" + c.s; }
  function count(el, to, f, ms, delay){
    if (calm){ el.textContent = f(to); return; }
    el.textContent = f(0); var t0 = null;
    (function step(t){ if (t0 === null) t0 = t + (delay||0);
      var k = Math.min(Math.max((t - t0)/ms,0),1); el.textContent = f(to*(1-Math.pow(1-k,4))); if (k<1) requestAnimationFrame(step); })(performance.now());
  }
  function stat(c){ c.reste = c.late + c.up; c.f = c.p + c.reste; c.st = c.late ? "late" : (c.reste ? "wait" : "paid"); return c; }
  CL.forEach(stat);
  function tint(c){ var i = c.n.charCodeAt(0) % TINT.length; return "--c:"+TINT[i][0]+";--bgc:"+TINT[i][1]; }

  function renderStats(anim){
    var nl = CL.filter(function(c){return c.late>0;}).length, rest = CL.reduce(function(s,c){return s+c.reste;},0);
    $("stats").innerHTML =
      '<div class="sc rv" style="--i:1"><div class="t"><i><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-5.5 6.5-5.5s6.5 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .6 3.5 2.2 3.5 5.2"/></svg></i>Clients</div><div class="s">Dans votre carnet</div><span class="v" data-to="'+CL.length+'" data-f="n"></span></div>'+
      '<div class="sc red rv" style="--i:2"><div class="t"><i><svg class="ic" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17.2v.1"/></svg></i>Avec un retard</div><div class="s">'+nl+' client(s) à relancer</div><span class="v" data-to="'+nl+'" data-f="n"></span></div>'+
      '<div class="sc grn rv" style="--i:3"><div class="t"><i><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/></svg></i>Reste à encaisser</div><div class="s">Argent encore attendu</div><span class="v" data-to="'+rest+'" data-f="m"></span></div>';
    document.querySelectorAll("#stats .v").forEach(function(el,i){
      var f = el.dataset.f === "n" ? function(x){return Math.round(x);} : fmt, to = +el.dataset.to;
      if (anim) count(el,to,f,1100,120+i*90); else el.textContent = f(to);
    });
  }
  function renderChips(){
    var N = {all:CL.length, late:0, wait:0, paid:0};
    CL.forEach(function(c){ N[c.st]++; });
    var L = [["all","Tous"],["late","En retard"],["wait","En attente"],["paid","À jour"]];
    $("chips").innerHTML = L.map(function(x){ return '<button data-f="'+x[0]+'" aria-pressed="'+(filter===x[0])+'">'+x[1]+'<em>'+N[x[0]]+'</em></button>'; }).join("");
  }
  function renderList(){
    var q = query.trim().toLowerCase();
    var rows = CL.map(function(c,i){ return [c,i]; }).filter(function(x){
      return (filter==="all" || x[0].st===filter) && (!q || (x[0].n+" "+x[0].e).toLowerCase().indexOf(q) > -1);
    }).sort(function(a,b){ return b[0].late - a[0].late || b[0].reste - a[0].reste; });
    if (!rows.length){ $("list").innerHTML = '<li class="none">Aucun client ne correspond à votre recherche.</li>'; return; }
    $("list").innerHTML = rows.map(function(x,k){
      var c = x[0], sm = c.late ? "En retard de "+c.d+" jours" : (c.reste ? "Paiement à venir" : "Tout est payé");
      return '<li class="row rv" style="--i:'+Math.min(k,10)+'" data-i="'+x[1]+'" tabindex="0" role="button" aria-label="Ouvrir la fiche de '+c.n+'">'+
        '<div class="who"><span class="av2" style="'+tint(c)+'">'+c.n[0]+'</span><div><b>'+c.n+'</b><span class="sub em">'+c.e+'</span><span class="stm '+c.st+'">'+sm+'</span></div></div>'+
        '<span class="c-f">'+fmt(c.f)+'</span><span class="c-p">'+fmt(c.p)+'</span><span class="a'+(c.late?" late":"")+'">'+fmt(c.reste)+'</span>'+
        '<span class="st"><span class="pill2 '+c.st+'">'+ST[c.st]+'</span></span>'+
        '<svg class="ic chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></li>';
    }).join("");
  }
  function renderAll(anim){ renderStats(anim); renderChips(); renderList(); }

  /* Fiche client et formulaire (tiroir à droite sur ordinateur, feuille en bas sur mobile) */
  var dr = $("dr"), ov = $("ov"), lastFocus = null;
  function open(html){
    lastFocus = document.activeElement; dr.innerHTML = '<div class="grab"></div>' + html;
    dr.hidden = ov.hidden = false; void dr.offsetWidth; dr.classList.add("open"); ov.classList.add("open");
    dr.querySelectorAll("[data-x]").forEach(function(b){ b.addEventListener("click", close); });
    var f = dr.querySelector("input,.go"); if (f && matchMedia("(min-width:900px)").matches) f.focus();
  }
  function close(){
    dr.classList.remove("open"); ov.classList.remove("open");
    setTimeout(function(){ dr.hidden = ov.hidden = true; }, calm ? 0 : 340);
    if (lastFocus) lastFocus.focus();
  }
  ov.addEventListener("click", close);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape"){ if (!dr.hidden) close(); toggle(false); } });

  function openClient(i){
    var c = CL[i], wa = c.t.replace(/\D/g,"");
    open('<div class="dh"><span class="av2" style="'+tint(c)+'">'+c.n[0]+'</span><div><h2>'+c.n+'</h2><span class="sub">Client depuis '+c.s+'</span></div><button class="x" data-x aria-label="Fermer"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>'+
      '<div class="ct"><a href="mailto:'+c.e+'"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 8 8 6 8-6"/></svg>E-mail</a><a href="tel:'+c.t.replace(/\s/g,"")+'"><svg class="ic" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>Appeler</a><a href="https://wa.me/'+wa+'" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20l1.3-4.2A8 8 0 1 1 8.4 18.8z"/></svg>WhatsApp</a></div>'+
      '<div class="ds"><div><span>Facturé</span><b id="d1"></b></div><div><span>Payé</span><b id="d2"></b></div><div><span>Reste</span><b id="d3" class="'+(c.late?"late":"")+'"></b></div></div>'+
      '<h3>Historique</h3><ul class="hist">'+c.h.map(function(h){ return '<li><span class="n">'+h[0]+'</span><span class="pill2 '+h[2]+'">'+(h[2]==="paid"?"Payé":h[2]==="late"?"En retard":"En attente")+'</span><b>'+fmt(h[1])+'</b></li>'; }).join("")+'</ul>'+
      (c.late ? '<a class="go" style="display:grid;place-items:center" href="payfollow-relances.html#'+encodeURIComponent(c.n)+'">Préparer une relance</a>' : '<a class="go" style="display:grid;place-items:center" href="payfollow-paiements.html">Nouveau paiement</a>'));
    [["d1",c.f],["d2",c.p],["d3",c.reste]].forEach(function(x,k){ count($(x[0]),x[1],fmt,900,150+k*80); });
    wireSoon(dr);
  }
  function openForm(){
    open('<div class="dh"><div><h2>Nouveau client</h2><span class="sub">Vous pourrez compléter la fiche plus tard.</span></div><button class="x" data-x aria-label="Fermer"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>'+
      '<form class="fm" id="fm" novalidate><div class="f"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg><input id="fn" autocomplete="off" placeholder="Nom du client" aria-label="Nom du client"></div><div class="f"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 8 8 6 8-6"/></svg><input id="fe" type="email" inputmode="email" placeholder="E-mail (facultatif)" aria-label="Adresse e-mail, facultatif"></div><div class="f"><svg class="ic" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><input id="ft" type="tel" inputmode="tel" placeholder="Téléphone (facultatif)" aria-label="Téléphone, facultatif"></div><p class="err" id="fer" role="alert"></p><button class="go" type="submit">Ajouter le client</button></form>');
    $("fm").addEventListener("submit", function(ev){
      ev.preventDefault(); var n = $("fn").value.trim();
      if (!n){ $("fn").setAttribute("aria-invalid","true"); $("fn").focus(); $("fer").textContent = "Entrez le nom du client."; return; }
      var e = $("fe").value.trim(), t = $("ft").value.trim();
      CL.push(stat({n:n,e:e||"—",t:t||"+226 00 00 00 00",p:0,late:0,up:0,d:0,s:"aujourd’hui",h:[]}));
      filter = "all"; query = ""; $("q").value = ""; close(); renderAll(false); toast("Client ajouté : " + n);
    });
  }

  /* Divers */
  var tt; function toast(m){ var t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove("on"); }, 2200); }
  function wireSoon(root){ root.querySelectorAll("[data-soon]").forEach(function(b){ b.onclick = function(){ toast("Cette page sera construite à la prochaine étape"); }; }); }
  wireSoon(document);

  $("addBtn").addEventListener("click", openForm);
  $("list").addEventListener("click", function(e){ var r = e.target.closest(".row"); if (r) openClient(+r.dataset.i); });
  $("list").addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " "){ var r = e.target.closest(".row"); if (r){ e.preventDefault(); openClient(+r.dataset.i); } } });
  $("chips").addEventListener("click", function(e){ var b = e.target.closest("button"); if (!b) return; filter = b.dataset.f; renderChips(); renderList(); });
  $("q").addEventListener("input", function(){ query = this.value; renderList(); });

  var ind = $("ind");
  function moveInd(){ var b = document.querySelector('#tabs [aria-current="page"]'); if (!b || !b.offsetWidth){ ind.style.opacity = 0; return; } ind.style.opacity = 1; ind.style.width = b.offsetWidth+"px"; ind.style.transform = "translateX("+b.offsetLeft+"px)"; }
  window.addEventListener("resize", moveInd);

  var av = $("avatar"), menu = $("menu");
  function toggle(o){ menu.hidden = !o; av.setAttribute("aria-expanded", o?"true":"false"); }
  av.addEventListener("click", function(e){ e.stopPropagation(); toggle(menu.hidden); });
  document.addEventListener("click", function(e){ if (!menu.contains(e.target)) toggle(false); });
  function mark(){ menu.querySelectorAll("[data-cur]").forEach(function(b){ b.setAttribute("aria-checked", b.dataset.cur===cur?"true":"false"); }); }
  menu.addEventListener("click", function(e){ var b = e.target.closest("[data-cur]"); if (!b) return; cur = b.dataset.cur; try { localStorage.setItem("pf_devise", cur); } catch(x){} mark(); renderAll(false); toggle(false); });

  mark(); renderAll(true); moveInd(); requestAnimationFrame(function(){ ind.classList.add("ready"); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);
})();
</script>
</body>
</html>
