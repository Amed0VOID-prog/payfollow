 return ph("Relances","Paiements en attente ou en retard")+`<div class="card" style="margin-bottom:16px;background:var(--soft)"><span class="sm">PayFollow n’envoie rien automatiquement : vous préparez le message, puis vous l’envoyez vous-même.</span></div><div class="card">${L.map(p=>`<div class="row"><div class="grow"><b>${esc(cl(p.cid).nom)}</b><div class="mut sm">${esc(p.service)}</div><div class="mut sm">Solde ${money(solde(p))} · Échéance ${fd(p.echeance)}</div></div>${badge(st(p))}<button class="btn pri sm" data-a="rel" data-id="${p.id}">${ic("bell")} Préparer une relance</button></div>`).join("")||'<div class="mut" style="padding:20px 0;text-align:center">Aucune relance à faire : tout est à jour.</div>'}</div>`}

function histList(){const t=F.tab;

function act2(a,id){
 const P=S&&S.pay.find(p=>p.id==id);
 ({async auth(){const e=$("#a_e").value.trim(),p=$("#a_p").value,m=$("#a_m");m.textContent="";

  if(!r.data.session){m.textContent="Compte créé. Confirmez votre adresse e-mail (pensez aux spams), puis connectez-vous.";return}

 newc(){const c=S.clients.find(x=>x.id==id)||{};modal(`<h3>${id?"Modifier le client":"Nouveau client"}</h3>${fld("f_nom","Nom complet",c.nom)}${fld("f_tel","Téléphone (WhatsApp)",c.tel,"tel",'placeholder="+226 70 00 00 00"')}${fld("f_email","E-mail",c.email,"email")}${fld("f_adr","Adresse",c.adresse)}<div class="mf"><button class="btn" data-a="close">Annuler</button><button class="btn pri" data-a="savec" data-id="${id||""}">Enregistrer</button></div>`)},
 savec(){const nom=$("#f_nom").value.trim();if(!nom)return toast("Le nom est obligatoire");const d={nom,tel:$("#f_tel").value.trim(),email:$("#f_email").value.trim(),adresse:$("#f_adr").value.trim()};
  if(id)Object.assign(S.clients.find(c=>c.id==id),d);else S.clients.push({id:uid(),...d});lg((id?"Client modifié – ":"Client ajouté – ")+nom);done("Client enregistré")},
 delc(){const n=S.pay.filter(p=>p.cid==id).length;cm("Supprimer "+esc(cl(id).nom)+" ?"+(n?" Ses "+n+" paiement(s) seront aussi supprimés.":""),"okdelc",id)},
 okdelc(){lg("Client supprimé – "+cl(id).nom);S.clients=S.clients.filter(c=>c.id!=id);S.pay=S.pay.filter(p=>p.cid!=id);done("Client supprimé")},
 hc(){const c=cl(id),L=S.pay.filter(p=>p.cid==id);modal(`<h3>Historique – ${esc(c.nom)}</h3><div class="mut">Reste à payer : <b>${money(sum(L.map(solde)))}</b></div>${L.map(p=>`<div class="row"><div class="grow"><b>${esc(p.service)}</b><div class="mut sm">Convenu ${money(p.total)} · Payé ${money(paye(p))} · Échéance ${fd(p.echeance)}</div>${p.hist.map(h=>`<div class="sm pos">+ ${money(h.m)} le ${fd(h.d)}</div>`).join("")}</div>${badge(st(p))}</div>`).join("")||empty}<div class="mf"><button class="btn" data-a="close">Fermer</button></div>`)},
 newp(){if(!S.clients.length)return modal(`<h3>Aucun client</h3><p class="mut">Ajoutez d’abord un client pour enregistrer un paiement.</p><div class="mf"><button class="btn pri" data-a="newc">Ajouter un client</button></div>`);
  const pd=P?paye(P):0;CP=pd;modal(`<h3>${P?"Modifier le paiement":"Nouveau paiement"}</h3><label>Client<select id="f_c">${S.clients.map(c=>`<option value="${c.id}" ${P&&P.cid==c.id?"selected":""}>${esc(c.nom)}</option>`).join("")}</select></label>${fld("f_s","Service fourni",P?.service)}${fld("f_t","Montant total convenu ("+cu()+")",P?.total,"number",'min="0" inputmode="numeric"')}${P?`<div class="mut sm" style="margin-bottom:12px">Déjà payé : <b>${money(pd)}</b>. Ajoutez des paiements avec « Versement ».</div>`:fld("f_p","Montant déjà payé ("+cu()+")",0,"number",'min="0" inputmode="numeric"')}${fld("f_e","Date prévue du paiement",P?.echeance||off(14),"date")}<div class="card" style="margin-bottom:12px;padding:12px">Solde restant : <b id="f_sol">${money(P?P.total-pd:0)}</b><div class="mut sm">Le statut se met à jour automatiquement.</div></div><div class="mf"><button class="btn" data-a="close">Annuler</button><button class="btn pri" data-a="savep" data-id="${id||""}">Enregistrer</button></div>`)},
 savep(){const cid=$("#f_c").value,service=$("#f_s").value.trim(),total=+$("#f_t").value,echeance=$("#f_e").value,pd=$("#f_p")?+$("#f_p").value||0:CP;

 vers(){modal(`<h3>Enregistrer un versement</h3><div class="mut" style="margin-bottom:12px">${esc(cl(P.cid).nom)} · ${esc(P.service)}<br>Solde restant : <b>${money(solde(P))}</b></div>${fld("f_m","Montant reçu ("+cu()+")",solde(P),"number",'min="0" inputmode="numeric"')}${fld("f_d","Date de réception",T,"date")}<div class="mf"><button class="btn" data-a="close">Annuler</button><button class="btn pri" data-a="savev" data-id="${id}">Valider le versement</button></div>`)},

  modal(`<h3>Relance – ${esc(c.nom)}</h3><p class="mut sm">Message généré automatiquement. Modifiez-le, puis copiez-le ou ouvrez WhatsApp. Rien n’est envoyé automatiquement.</p><textarea id="rm" rows="8">${esc(m)}</textarea><div class="mf" style="margin-top:12px"><button class="btn" data-a="close">Fermer</button><button class="btn" data-a="copy">${ic("copy")} Copier</button><button class="btn pri" data-a="wa" ${c.tel?"":"disabled"}>${ic("chat")} WhatsApp</button></div>${c.tel?"":'<div class="mut sm">Aucun numéro enregistré pour ce client.</div>'}`);lg("Relance préparée – "+c.nom);save()},
